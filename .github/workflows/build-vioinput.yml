name: build-vioinput-mt

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?LinkId=2371554"
          Write-Host "Downloading WDK from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\wdk.exe"
          Write-Host "Installing WDK..."
          Start-Process -Wait -FilePath "$env:TEMP\wdk.exe" -ArgumentList "/install", "/quiet", "/norestart", "/accepteula"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build vioinput
        run: msbuild vioinput/vioinput.sln -p:Configuration="Win11 Release" -p:Platform=x64 -m -v:m

      - name: Sign drivers with VirtIOTestCert
        shell: pwsh
        run: |
          $tools = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include inf2cat.exe,signtool.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          foreach ($t in $tools) { $env:Path = (Split-Path $t) + ";" + $env:Path }
          Write-Host "PATH tools: $tools"
          New-Item -ItemType Directory -Force -Path signed | Out-Null
          Copy-Item vioinput/sys/x64/Win11Release/vioinput.sys signed/
          Copy-Item vioinput/hidpassthrough/x64/Win11Release/viohidkmdf.sys signed/
          Copy-Item vioinput/package/x64/Win11Release/vioinput.inf signed/
          Write-Host "Generating catalog..."
          inf2cat /driver:signed /os:10_X64 /verbose 2>&1 | Out-String | Write-Host
          Write-Host "Signing..."
          signtool sign /fd SHA256 /f build/VirtIOTestCert.pfx signed/vioinput.sys 2>&1 | Out-String | Write-Host
          signtool sign /fd SHA256 /f build/VirtIOTestCert.pfx signed/viohidkmdf.sys 2>&1 | Out-String | Write-Host
          signtool sign /fd SHA256 /f build/VirtIOTestCert.pfx signed/vioinput.cat 2>&1 | Out-String | Write-Host
          Get-ChildItem signed | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vioinput-mt-x64
          path: signed/
          if-no-files-found: error
